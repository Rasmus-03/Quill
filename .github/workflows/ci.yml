name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Ubuntu 26.04's `maxima` is a GCL build that cannot load the Lisp share
      # packages the math commands need (linearalgebra: submatrix, rowop,
      # mat_trace; draw), and without maxima-share it has no ode2, unit or
      # ezunits either. maxima-sage is the ECL build, and maxima-sage-share
      # ships every one of those packages: run it under the name the app
      # launches, which maxima_available() also looks for.
      - name: Install Maxima and desktop tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends maxima-sage maxima-sage-share xdg-utils
          sudo ln -sf /usr/bin/maxima-sage /usr/local/bin/maxima

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests (lib)
        run: cargo test --workspace --lib

      # `--lib` skips the engine's tests/ directory (save and macro regressions).
      - name: Tests (engine integration)
        run: cargo test -p wordcraft-engine --tests

      # Maxima-dependent math tests live in wordcraft-engine and are
      # #[ignore]d by default (they spawn the CAS, so they are slow).
      # Only the engine's ignored tests run here: the ui-egui ignored
      # tests are benchmarks and a load-flaky i18n audit, not CI content.
      - name: Maxima-dependent tests
        run: cargo test -p wordcraft-engine --lib -- --ignored
