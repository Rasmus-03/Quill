name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Maxima and desktop tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends maxima xdg-utils

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          components: rustfmt, clippy
          # The wasm gate below (cargo xtask wasm) checks the browser build of every layer.
          targets: wasm32-unknown-unknown

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # The whole workspace, every test target: the DOCX round-trip and hostile-input suites
      # (crates/docx/tests), the engine's integration tests, the binaries' own unit tests and
      # the MCP, fonts, UI and CLI integration tests. `--lib` would skip all of them.
      - name: Tests
        run: cargo test --workspace

      # Maxima-dependent math tests live in wordcraft-engine and are
      # #[ignore]d by default (they spawn the CAS, so they are slow).
      # Only the engine's ignored tests run here: the ui-egui ignored
      # tests are benchmarks and a load-flaky i18n audit, not CI content.
      - name: Maxima-dependent tests
        run: cargo test -p wordcraft-engine --lib -- --ignored

      # The repo's own gates, so they run on every push and not only when a developer
      # remembers `cargo xtask ci`:
      # - assets: every file that ships needs a row in ATTRIBUTION.md
      # - layers: nothing below the UI may depend on the UI framework
      # - wasm: the browser build of every layer still compiles
      - name: Assets (ATTRIBUTION)
        run: cargo xtask assets

      - name: Layering
        run: cargo xtask layers

      - name: WebAssembly
        run: cargo xtask wasm

  # The real-world .docx corpus (`crates/docx/tests/corpus.rs`) skips when the corpus is absent,
  # so the job above passes without it. This job fetches the files the manifest pins by SHA-256
  # and runs the round trip for real: a file that loses its formatting, or that an upstream change
  # made unrecognisable to the pinned hash, fails here.
  corpus:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      # Apache POI's test documents (Apache-2.0), fetched by name and hash, never committed:
      # every file that Word, Outlook or LibreOffice wrote is read → written → read again.
      - name: Fetch the corpus
        run: cargo xtask corpus --docx

      - name: Round-trip every corpus file
        run: cargo test -p wordcraft-docx --test corpus -- --nocapture
