[package]
name = "wordcraft-formats"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "WordCraft import/export: plain text, Markdown, HTML, RTF, OpenDocument Text and LaTeX"

[lints]
workspace = true

[dependencies]
wordcraft-doc = { workspace = true }
wordcraft-geom = { workspace = true }
image = { workspace = true }
quick-xml = { workspace = true }
zip = { workspace = true }
log = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }

# PDF Reflow (desktop only): the text reflows through `pdf-extract`; `lopdf` (through the same
# crate) reads the pictures' XObjects and content streams.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
pdf-extract = "0.12"
