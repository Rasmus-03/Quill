[package]
name = "wordcraft-docx"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Quill DOCX (OOXML WordprocessingML) reader and writer"

[lints]
workspace = true

[dependencies]
wordcraft-doc = { workspace = true }
wordcraft-geom = { workspace = true }
quick-xml = { workspace = true }
zip = { workspace = true }
thiserror = { workspace = true }
log = { workspace = true }
cfb = { workspace = true }
aes = { workspace = true }
sha1 = { workspace = true }
sha2 = { workspace = true }
hmac = { workspace = true }
base64 = { workspace = true }
getrandom = { workspace = true }
zeroize = { workspace = true }

# The browser's `crypto.getRandomValues` for the salts and keys of encrypted saves.
[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
getrandom = { workspace = true, features = ["wasm_js"] }

[dev-dependencies]
proptest = { workspace = true }
# The corpus harness paginates each file to compare the page count with Word's own
# (`crates/docx/tests/corpus.rs`, behind `QUILL_CORPUS_PAGES=1`). Tests may use a sibling
# crate in the same layer; production code may not (xtask/src/layers.rs).
wordcraft-layout = { workspace = true }
serde_json = { workspace = true }
image = { workspace = true }
zip = { workspace = true }
