[package]
name = "wordcraft-cloud-server"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "WordCraft real-time collaboration server: shared documents with operational transform"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.26", features = ["native-tls"] }
tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }
url = { version = "2", features = ["serde"] }
log = { workspace = true }
env_logger = { version = "0.11", optional = true }
structopt = { version = "0.5", optional = true }

[features]
default = ["log", "structopt"]
log = ["dep:log", "dep:env_logger", "dep:structopt"]
structopt = ["dep:structopt"]
